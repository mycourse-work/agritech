:root{--paper:#F4F1EA;--white:#FFFFFF;--surface-2:#FAF8F3;--ink:#263341;--ink-2:#465565;--heading:#3B4E62;--muted:#5A6776;--line:#CEC8BA;--line-soft:#E3DED3;--control:#7A8592;--accent:#036DA0;--accent-hover:#025A85;--accent-soft:#E4F4FD;--accent-line:#B5DFF6;--sky:#05A5F1;--dark:#1F2B38;--on-accent:#FFFFFF;--ok:#1E6B45;--ok-bg:#E3F1E8;--bad:#9A3324;--bad-bg:#FBE6E1;--warn:#7A5A14;--warn-bg:#F6EDD3;--r-s:8px;--r-m:12px;--r-l:16px;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--serif:"Playfair Display",Georgia,"Times New Roman",serif}
[data-theme=dark]{--paper:#0B0E12;--white:#1F2B38;--surface-2:#18222D;--ink:#EEF1F4;--ink-2:#D3D9E0;--heading:#E4E9EF;--muted:#B3BCC6;--line:#4A5868;--line-soft:#344252;--control:#8D99A6;--accent:#5CC3F5;--accent-hover:#8AD4F8;--accent-soft:#12324A;--accent-line:#2B5F80;--on-accent:#0B0E12;--ok:#8FD3AA;--ok-bg:#173A28;--bad:#F2A58F;--bad-bg:#3D2620;--warn:#ECD08A;--warn-bg:#3A3220}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:0;color:var(--ink);font:16px/1.45 var(--font);overflow-x:hidden;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:12px 14px 14px}
h1,h2,h3,p,ul,ol,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font:500 20px/1.25 var(--serif);color:var(--heading)}
.count{flex:none;font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;margin-top:8px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--sky);transition:width .25s ease}
.step{margin-top:12px}
.step:focus{outline:none}
.prompt{font-weight:650;font-size:18px;line-height:1.35;color:var(--ink)}
.lead{font-size:16px;color:var(--muted)}
.sub{font-size:16px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:10px 18px;border:2px solid var(--accent);border-radius:var(--r-s);background:var(--accent);color:var(--on-accent);font-weight:650;font-size:17px;line-height:1.25;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--white);color:var(--accent)}
.btn[aria-disabled=true]{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn{flex:1 1 auto}
/* Answer buttons: full width, one per row. */
.choices{display:grid;gap:8px;margin-top:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:10px 12px;text-align:left;border:2px solid var(--line);border-radius:var(--r-s);background:var(--white);font-size:16px;line-height:1.35}
.choice[aria-disabled=true]{cursor:default}
.choice .tag{flex:none;font-size:16px;font-weight:700}
.choice.right,.choice.right:hover{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .tag{color:var(--ok)}
.choice.wrong,.choice.wrong:hover{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .tag{color:var(--bad)}
.choice.flag,.choice.flag:hover{border-color:var(--warn);background:var(--warn-bg)}
.choice.flag .tag{color:var(--warn)}
.fb{margin-top:10px;padding:8px 12px;border-radius:var(--r-s);border-left:4px solid var(--ok);background:var(--ok-bg);font-size:16px;line-height:1.4}
.fb.bad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.fb strong{font-weight:700}
.fb:focus{outline:none}
.status{font-size:16px;color:var(--muted);margin-top:6px}
.status:empty{display:none}
.score{font:500 34px/1.1 var(--serif);color:var(--accent)}
.done h2{font:500 20px/1.3 var(--serif);color:var(--heading)}
.done p{margin-top:6px}
details.more{margin-top:10px;border-top:1px solid var(--line-soft)}
details.more summary{display:flex;align-items:center;min-height:44px;font-weight:650;color:var(--accent);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:"";flex:none;width:8px;height:8px;margin:0 10px 0 4px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open] summary:before{transform:rotate(45deg)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
@media(max-width:400px){main{padding:10px 12px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (hover:hover){.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}.btn.secondary:hover{background:var(--accent-soft)}.choice:not([aria-disabled=true]):hover{border-color:var(--accent)}}
/* The course player has a sticky header and footer (about 70 px each) around the frame. */
main *{scroll-margin:80px 0 90px}
/* Focus mode: fill the height the player gives us, Done at the foot. */
/* The room under the player's bar is ~615 px at 375x667, so the Done row stays slim (44 px button, 6 px gap). */
.focus main{min-height:var(--focus-h,auto);display:flex;flex-direction:column;border:0;border-radius:0;padding-bottom:8px}
.focus main>*{flex:none}
.focus-done{margin-top:auto;padding-top:6px;display:flex;justify-content:flex-end}
.focus-done .btn{min-width:120px;min-height:44px}
.tool{margin-top:8px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:var(--r-s);background:var(--white);font-weight:650;font-size:19px;line-height:1.3;color:var(--ink)}
.tool:focus{outline:none}
.kinds{margin-top:10px}
.kind{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:56px;padding:8px 12px}
.kind .name{font-weight:700;font-size:17px;color:var(--accent)}
.kind .desc{font-size:16px;color:var(--muted)}
.kind .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.kind.right .name{color:var(--ok)}.kind.wrong .name{color:var(--bad)}
.tally{display:grid;gap:6px;margin-top:10px}
.tally li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:var(--r-s);background:var(--white);border:1px solid var(--line-soft)}
.tally b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 id="title">Sort the AI</h1>
    <p class="count" id="count" aria-hidden="true"></p>
  </header>
  <div class="bar" aria-hidden="true"><span id="bar-fill"></span></div>

  <section class="step" id="play" aria-labelledby="ask">
    <p class="lead" id="ask">Which kind of AI is this farm tool?</p>
    <p class="tool" id="card" aria-live="off"></p>
    <div class="choices kinds" id="kinds" role="group" aria-labelledby="ask"></div>
    <p class="fb" id="fb" hidden></p>
    <div class="actions" id="next-wrap" hidden><button class="btn" type="button" id="next">Next tool</button></div>
  </section>

  <section class="step done" id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title"></h2>
    <ul class="tally" id="tally"></ul>
    <p id="result-text"></p>
    <div class="actions">
      <button class="btn" type="button" id="retry" hidden>Try the ones I missed</button>
      <button class="btn secondary" type="button" id="reset">Start again</button>
    </div>
  </section>
</main>

function copyFrom(ta,status){
  function fallback(){
    var back=document.activeElement,d=ta.closest("details");d=d&&!d.open?d:null;if(d)d.open=true;
    ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
    var ok=false;try{ok=document.execCommand("copy");}catch(e){ok=false;}
    status.textContent=ok?"Copied. Now paste it into your AI chat.":"The text is selected. Press and hold it, then tap Copy (or press Ctrl+C).";
    if(ok&&d){d.open=false;if(back&&back!==document.body)back.focus({preventScroll:true});}
  }
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==="function"){
    navigator.clipboard.writeText(ta.value).then(function(){status.textContent="Copied. Now paste it into your AI chat.";},fallback);
  }else{fallback();}
}
function progress(done,total,text){$("count").textContent=text;$("bar-fill").style.width=Math.round(done/total*100)+"%";}
function focusQuiet(node){if(node.tabIndex<0&&!node.hasAttribute("tabindex"))node.setAttribute("tabindex","-1");node.focus({preventScroll:true});}
// Scroll the node into the player's view once the frame has grown to fit it (the resize is async).
function reveal(node){
  var tries=0;
  (function go(){
    if(node.getBoundingClientRect().bottom>window.innerHeight+1&&tries++<20){window.setTimeout(go,60);return;}
    try{node.scrollIntoView({block:"nearest"});}catch(e){}
  })();
}
var BINS=[
  {id:"senses",name:"Senses",desc:"Takes readings, spots a pattern"},
  {id:"predicts",name:"Predicts",desc:"Uses past numbers to call what's next"},
  {id:"writes",name:"Writes and talks",desc:"Reads and writes everyday words"}
];
var ITEMS=[
  {id:"collar",text:"Collar that flags a cow on heat",bin:"senses",why:"It reads her movement and rumination and spots the pattern of a heat."},
  {id:"chat",text:"Chat app that drafts a letter to the council",bin:"writes",why:"It writes in everyday words."},
  {id:"pasture",text:"Pasture growth model for next week",bin:"predicts",why:"It uses past growth, weather and soil data to call how much grass is coming."},
  {id:"weed",text:"Sprayer camera that tells a weed from the crop",bin:"senses",why:"It looks at the picture and picks out the weeds."},
  {id:"drone",text:"Drone that counts ewes from a photo",bin:"senses",why:"It picks out each sheep in the picture. That's sensing, not predicting."},
  {id:"voice",text:"Phone that turns your voice into a text message",bin:"writes",why:"It turns your speech into written words."},
  {id:"weather",text:"Weather app that says rain on Thursday",bin:"predicts",why:"A forecast is a best guess about what comes next."},
  {id:"summary",text:"App that sums up a long email in three lines",bin:"writes",why:"It reads words and writes a shorter version."},
  {id:"lambing",text:"Lambing date estimate from scanning",bin:"predicts",why:"It works forward from scanning to a likely date."}
];
function binName(id){for(var i=0;i<BINS.length;i++)if(BINS[i].id===id)return BINS[i].name;return "";}
var queue=[],pos=0,result={},first={},answered=false;
BINS.forEach(function(b){
  var btn=el("button","choice kind");btn.type="button";btn.dataset.bin=b.id;
  var head=el("span","head");head.appendChild(el("span","name",b.name));btn.appendChild(head);
  btn.appendChild(el("span","desc",b.desc));
  btn.addEventListener("click",function(){choose(b.id);});
  $("kinds").appendChild(btn);
});
function start(list){queue=list;pos=0;$("result").hidden=true;$("play").hidden=false;showTool();}
function showTool(){
  var it=queue[pos];answered=false;
  progress(pos,queue.length,(pos+1)+" of "+queue.length);
  $("card").textContent=it.text;$("card").dataset.id=it.id;
  document.querySelectorAll(".kind").forEach(function(b){
    b.classList.remove("right","wrong");b.removeAttribute("aria-disabled");b.removeAttribute("aria-label");
    var t=b.querySelector(".tag");if(t)t.remove();
  });
  $("fb").hidden=true;$("next-wrap").hidden=true;reportHeight();
}
function choose(bin){
  if(answered)return;answered=true;
  var it=queue[pos],right=bin===it.bin;result[it.id]=right;if(!(it.id in first))first[it.id]=right;
  document.querySelectorAll(".kind").forEach(function(b){
    b.setAttribute("aria-disabled","true");
    var tag=null;
    if(b.dataset.bin===it.bin){b.classList.add("right");tag=right?"Right":"Answer";}
    else if(b.dataset.bin===bin){b.classList.add("wrong");tag="Your pick";}
    if(tag){b.querySelector(".head").appendChild(el("span","tag",tag));b.setAttribute("aria-label",binName(b.dataset.bin)+". "+tag+".");}
  });
  var fb=$("fb");fb.textContent="";fb.className="fb"+(right?"":" bad");
  fb.appendChild(el("strong",null,right?"Right. ":"It's "+binName(it.bin)+". "));fb.appendChild(document.createTextNode(it.why));
  fb.hidden=false;$("next-wrap").hidden=false;
  $("next").textContent=pos<queue.length-1?"Next tool":"See how I did";
  progress(pos+1,queue.length,(pos+1)+" of "+queue.length);
  announce((right?"Right. ":"It's "+binName(it.bin)+". ")+it.why);
  $("next").focus({preventScroll:true});reportHeight();reveal($("next"));
}
$("next").addEventListener("click",function(){
  if(pos<queue.length-1){pos++;showTool();focusQuiet($("card"));reveal($("title"));announce("Tool "+(pos+1)+" of "+queue.length);return;}
  finish();
});
function finish(){
  var right=ITEMS.filter(function(it){return result[it.id];}).length,missed=ITEMS.length-right;
  $("play").hidden=true;$("result").hidden=false;$("count").textContent="Finished";$("bar-fill").style.width="100%";
  var firstRight=ITEMS.filter(function(it){return first[it.id];}).length;
  $("result-title").textContent=firstRight<right?firstRight+" of "+ITEMS.length+" first time, "+(missed?right:"all "+right)+" now":right+" of "+ITEMS.length+" right";
  var t=$("tally");t.textContent="";
  BINS.forEach(function(b){
    var all=ITEMS.filter(function(it){return it.bin===b.id;}),ok=all.filter(function(it){return result[it.id];}).length;
    var li=el("li");li.appendChild(el("span",null,b.name));li.appendChild(el("b",null,ok+" of "+all.length));t.appendChild(li);
  });
  $("result-text").textContent="Senses: takes readings. Predicts: looks ahead. Writes and talks: works with words.";
  $("retry").hidden=!missed;$("retry").textContent=missed===1?"Try the one I missed":"Try the "+missed+" I missed";
  announce($("result-title").textContent+".");
  focusQuiet($("result-title"));reportHeight();reveal($("title"));
}
$("retry").addEventListener("click",function(){start(ITEMS.filter(function(it){return !result[it.id];}));focusQuiet($("card"));reveal($("title"));});
$("reset").addEventListener("click",function(){result={};first={};start(ITEMS.slice());focusQuiet($("card"));reveal($("title"));});
if(props.title)$("title").textContent=props.title;
start(ITEMS.slice());ready();
</script>
</body>
</html>
